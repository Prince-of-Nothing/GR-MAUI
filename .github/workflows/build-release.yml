name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SOLUTION: GR-MAUI.slnx

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          packages: 'platforms;android-33,build-tools;34.0.0'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build Android
        run: dotnet build GR-MAUI.Android/GR-MAUI.Android.csproj -c Release
      - name: Build APK
        run: dotnet build GR-MAUI.Android/GR-MAUI.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:AndroidEnableProfiledAot=false
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GR-MAUI-Android-APK
          path: GR-MAUI.Android/bin/Release/net10.0-android/*.apk

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: GR-MAUI-Android-APK
          path: artifacts/android/
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" \
            --title "GR-MAUI $tag" \
            --notes "Cross-platform GidiReads MAUI app — Android APK" \
            artifacts/android/*.apk || true